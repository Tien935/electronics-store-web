server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:h2:mem:retail_product_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    com.techmart.product: DEBUG
    org.hibernate.SQL: DEBUG
